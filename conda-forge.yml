build_platform:
  win_arm64: linux_64
  win_32: win_64
conda_build:
  pkg_format: '2'
conda_build_tool: rattler-build
conda_forge_output_validation: true
conda_install_tool: pixi
github:
  branch_name: main
  tooling_branch_name: main
test: native_and_emulated
workflow_settings:
  store_build_artifacts:
    - value: true
  vm_image:
    - value: windows-2025-vs2026
      platform: win_64
